<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REACT ALD 공정 DB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: lab-notebook utility. Cool slate neutrals biased to cobalt, one cobalt accent,
   PSC = blue / FE = orange identity chips.
   Layout: header summary → filter bar → [periodic-table picker | temperature window chart] → sortable table → detail drawer. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --ink: #12161d;
  --ink-2: #4a5260;
  --ink-3: #6b7383;
  --line: #d9dee6;
  --accent: #2346b8;
  --accent-soft: #e3e9fb;
  --psc: #2a78d6;
  --fe: #eb6834;
  --good: #0a7d2c;
  --good-bg: #e2f3e6;
  --warn: #8a5a00;
  --warn-bg: #fdf0d2;
  --serious: #b0431b;
  --serious-bg: #fbe5dc;
  --dot: #2346b8;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #171b23; --surface-2: #1f2430; --ink: #eceff4; --ink-2: #b6bdca; --ink-3: #8c94a3;
    --line: #2c3341; --accent: #8aa6ff; --accent-soft: #23305a; --psc: #3987e5; --fe: #d95926;
    --good: #5fd27d; --good-bg: #173322; --warn: #f2c14e; --warn-bg: #3a2e12; --serious: #f0906a; --serious-bg: #3d2219;
    --dot: #8aa6ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #171b23; --surface-2: #1f2430; --ink: #eceff4; --ink-2: #b6bdca; --ink-3: #8c94a3;
  --line: #2c3341; --accent: #8aa6ff; --accent-soft: #23305a; --psc: #3987e5; --fe: #d95926;
  --good: #5fd27d; --good-bg: #173322; --warn: #f2c14e; --warn-bg: #3a2e12; --serious: #f0906a; --serious-bg: #3d2219;
  --dot: #8aa6ff; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 48px; display: grid; gap: 20px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 16px; font-weight: 600; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header { display: grid; gap: 14px; }
.eyebrow { font-size: 13px; color: var(--ink-3); }
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; display: grid; }
.stat b { font-family: var(--font-mono); font-size: 20px; font-weight: 500; }
.stat span { font-size: 12px; color: var(--ink-3); }

/* filters */
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.ctl { display: grid; gap: 4px; }
.ctl label, .ctl .lbl { font-size: 12px; color: var(--ink-3); }
.ctl input[type="search"] { width: 240px; }
input[type="search"], input[type="number"], select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; height: 34px; }
input[type="number"] { width: 78px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; height: 34px; }
.seg button { border: 0; background: var(--surface); padding: 0 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { color: #0f1218; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { color: #0f1218; } }
.checks { display: flex; gap: 10px; align-items: center; height: 34px; font-size: 13px; }
.checks label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; color: var(--ink-2); }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; height: 34px; padding: 0 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }

/* overview row */
.overview { display: grid; grid-template-columns: minmax(0, 540px) minmax(0, 1fr); gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.panel p.note { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.ptable { display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); gap: 3px; }
.el { aspect-ratio: 1; border-radius: 4px; display: grid; place-items: center; font-size: 11px; color: var(--ink-3); background: var(--surface-2); border: 1px solid transparent; position: relative; padding: 0; }
.el.has { background: var(--accent-soft); color: var(--ink); font-weight: 600; cursor: pointer; border-color: var(--line); }
.el.has:hover { border-color: var(--accent); }
.el.on { background: var(--accent); color: #fff; border-color: var(--accent); }
:root[data-theme="dark"] .el.on { color: #0f1218; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .el.on { color: #0f1218; } }
.el sup { position: absolute; top: 1px; right: 3px; font-size: 8.5px; font-weight: 500; font-family: var(--font-mono); }
.chart-wrap { position: relative; overflow-x: auto; }
svg.strip { display: block; width: 100%; min-width: 520px; height: auto; }
svg.strip text { fill: var(--ink-2); font-family: var(--font-body); font-size: 12px; }
svg.strip .tick text { fill: var(--ink-3); font-family: var(--font-mono); font-size: 11px; }
svg.strip .grid line { stroke: var(--line); }
svg.strip .ref line { stroke: var(--ink-3); stroke-dasharray: 3 3; }
svg.strip .ref text { fill: var(--ink-3); font-size: 11px; }
svg.strip circle.pt { fill: var(--dot); stroke: var(--surface); stroke-width: 2; cursor: pointer; }
svg.strip circle.hit { fill: transparent; cursor: pointer; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 12px; line-height: 1.4; max-width: 260px; opacity: 0; transition: opacity .1s; z-index: 5; }

/* table */
.results { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.results-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.results-head .count { color: var(--ink-2); font-size: 13px; }
.tbl-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 1100px; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--ink-3); background: var(--surface); position: sticky; top: 0; white-space: nowrap; }
th[data-sort] { cursor: pointer; }
td.doi { font-size: 12px; max-width: 190px; word-break: break-all; }
th[data-sort]:hover { color: var(--ink); }
th .arr { font-family: var(--font-mono); }
td.num { text-align: right; white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:focus-visible { outline-offset: -2px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; color: var(--ink-2); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--psc); }
.chip.fe::before { background: var(--fe); }
.sub { color: var(--ink-3); font-size: 12px; }
.empty { padding: 28px 16px; color: var(--ink-2); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .38); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
aside.drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(560px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 21; transform: translateX(100%); transition: transform .18s ease; overflow-y: auto; padding: 22px 22px 40px; display: grid; gap: 18px; align-content: start; }
aside.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { aside.drawer, .scrim, .tip { transition: none; } }
.drawer-top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.drawer h3 { font-size: 20px; }
.drawer section { display: grid; gap: 8px; }
.drawer h4 { margin: 0; font-size: 12px; color: var(--ink-3); font-weight: 600; }
dl.kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--ink-3); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.finding { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin: 0; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .15s; z-index: 30; }
.toast.show { opacity: 1; }

@media (max-width: 960px) {
  .overview { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .wrap { padding: 16px 16px 40px; }
  .ctl input[type="search"] { width: 100%; }
  .ctl.grow { flex: 1 1 100%; }
  dl.kv { grid-template-columns: 96px 1fr; }
  .el { font-size: 9px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">화학생명공학과 AI 활용 발표회 · 팀 REACT · 지도교수 박혜진</div>
    <h1>페로브스카이트·강유전체 ALD 공정 데이터베이스</h1>
    <div class="stats" id="stats"></div>
  </header>

  <div class="filters" role="search">
    <div class="ctl grow">
      <label for="q">검색</label>
      <input id="q" type="search" placeholder="재료, 전구체, 계면, 키워드 (예: TDMASn, HZO, C60)">
    </div>
    <div class="ctl">
      <span class="lbl" id="field-lbl">분야</span>
      <div class="seg" role="group" aria-labelledby="field-lbl" id="field-seg">
        <button type="button" data-v="all" aria-pressed="true">전체</button>
        <button type="button" data-v="PSC" aria-pressed="false">태양전지</button>
        <button type="button" data-v="FE" aria-pressed="false">강유전체</button>
      </div>
    </div>
    <div class="ctl"><label for="pos">적용 위치</label><select id="pos"></select></div>
    <div class="ctl"><label for="prec">전구체</label><select id="prec"></select></div>
    <div class="ctl"><label for="co">반응물</label><select id="co"></select></div>
    <div class="ctl"><label for="mode">ALD 방식</label><select id="mode"></select></div>
    <div class="ctl">
      <span class="lbl">증착 온도 (°C)</span>
      <div style="display:flex;gap:6px;align-items:center">
        <input id="tmin" type="number" min="0" max="500" step="5" placeholder="최소" aria-label="최소 온도">
        <span class="sub">–</span>
        <input id="tmax" type="number" min="0" max="500" step="5" placeholder="최대" aria-label="최대 온도">
      </div>
    </div>
    <button class="btn" type="button" id="reset">필터 초기화</button>
  </div>

  <div class="overview">
    <section class="panel" aria-labelledby="pt-title">
      <h2 id="pt-title">원소로 찾기</h2>
      <div class="ptable" id="ptable"></div>
      <p class="note">ALD 막에 들어간 금속·도펀트 원소다. 숫자는 레코드 수이고, 여러 원소를 고르면 모두 포함한 공정만 남는다.</p>
    </section>
    <section class="panel" aria-labelledby="ch-title">
      <h2 id="ch-title">적용 위치별 증착 온도</h2>
      <div class="legend"><span>점 하나가 공정 하나</span><span>점선 100 °C</span></div>
      <div class="chart-wrap" id="chart"></div>
    </section>
  </div>

  <section class="results" aria-labelledby="res-title">
    <div class="results-head">
      <h2 id="res-title">공정 목록 <span class="count" id="count"></span></h2>
      <div style="display:flex;gap:8px">
        <button class="btn" type="button" id="copy-csv">CSV 복사</button>
        <button class="btn" type="button" id="copy-json">JSON 복사</button>
      </div>
    </div>
    <div class="tbl-scroll">
      <table>
        <thead><tr>
          <th data-sort="id">ID <span class="arr"></span></th>
          <th>재료</th>
          <th>전구체 / 반응물</th>
          <th>방식</th>
          <th data-sort="temp_C" class="num">온도 °C <span class="arr"></span></th>
          <th data-sort="thickness_nm" class="num">두께 nm <span class="arr"></span></th>
          <th data-sort="gpc_A" class="num">GPC Å/cyc <span class="arr"></span></th>
          <th>적용 위치</th>
          <th data-sort="perf">성능 <span class="arr"></span></th>
          <th>출처 (DOI)</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>조건에 맞는 공정이 없다. 필터를 줄이거나 초기화한다.</div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="d-title" role="dialog"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip"></div>

}

function sortRows(rows) {
  const { key, dir } = state.sort;
  const val = (r) => key === "perf" ? perfValue(r)
    : key === "id" ? (r.field === "PSC" ? "0" : "1") + r.id : r[key];
  return rows.slice().sort((a, b) => {
    const va = val(a), vb = val(b);
    if (va === null || va === undefined) return 1;
    if (vb === null || vb === undefined) return -1;
    return (va < vb ? -1 : va > vb ? 1 : 0) * dir;
  });
}

function renderStats() {
  const papers = new Set(RECORDS.map((r) => r.source.doi)).size;
  const n = (f) => RECORDS.filter(f).length;
  const items = [
    [RECORDS.length, "공정 레코드"], [papers, "논문"],
    [n((r) => r.field === "PSC"), "태양전지"], [n((r) => r.field === "FE"), "강유전체"],
    [new Set(RECORDS.flatMap((r) => r.elements || [])).size, "원소"],
  ];
  $("stats").innerHTML = items.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
}

function fillSelect(id, values, labelFn, allLabel) {
  $(id).innerHTML = `<option value="">${allLabel}</option>` + values.map((v) => `<option value="${esc(v)}">${esc(labelFn ? labelFn(v) : v)}</option>`).join("");
}

function renderPeriodic(rows) {
  const counts = {};
  rows.forEach((r) => (r.elements || []).forEach((e) => { counts[e] = (counts[e] || 0) + 1; }));
  const all = {};
  RECORDS.forEach((r) => (r.elements || []).forEach((e) => { all[e] = true; }));
  let html = "";
  PERIODS.forEach((row, p) => {
    const byGroup = Object.fromEntries(row.map(([s, g]) => [g, s]));
    for (let g = 1; g <= 18; g++) {
      const s = byGroup[g];
      if (!s) { html += `<div aria-hidden="true"></div>`; continue; }
      if (all[s]) {
        const on = state.els.has(s);
        html += `<button type="button" class="el has${on ? " on" : ""}" data-el="${s}" aria-pressed="${on}" title="${s}: ${counts[s] || 0}건">${s}<sup>${counts[s] || 0}</sup></button>`;
      } else {
        html += `<div class="el" aria-hidden="true">${s}</div>`;
      }
    }
  });
  $("ptable").innerHTML = html;
}

function renderChart(rows) {
  const W = 640, rowH = 34, top = 14, left = 128, right = 18, bottom = 36;
  const positions = POS_ORDER.filter((p) => RECORDS.some((r) => r.position === p));
  const H = top + positions.length * rowH + bottom;
  const xMax = 350, x = (t) => left + (t / xMax) * (W - left - right);
  const pts = rows.filter((r) => typeof r.temp_C === "number");
  let s = `<svg class="strip" viewBox="0 0 ${W} ${H}" role="img" aria-label="적용 위치별 ALD 증착 온도 분포">`;
  s += '<g class="grid tick">';
  for (let t = 0; t <= xMax; t += 50) {
    s += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 4}" y2="${H - bottom + 4}"/>`;
    s += `<text x="${x(t)}" y="${H - bottom + 20}" text-anchor="middle">${t}</text>`;
  }
  s += `</g><text x="${W - right}" y="${H - 4}" text-anchor="end" class="sub">증착 온도 (°C)</text>`;
  s += `<g class="ref"><line x1="${x(100)}" x2="${x(100)}" y1="${top - 4}" y2="${H - bottom + 4}"/></g>`;
  positions.forEach((p, i) => {
    const cy = top + i * rowH + rowH / 2;
    s += `<text x="${left - 12}" y="${cy + 4}" text-anchor="end">${esc(POS_LABEL[p])}</text>`;
    const here = pts.filter((r) => r.position === p).sort((a, b) => a.temp_C - b.temp_C);
    const seen = {};
    here.forEach((r) => {
      const k = Math.round(r.temp_C / 6);
      const n = seen[k] = (seen[k] || 0) + 1;
      const dy = n === 1 ? 0 : (n % 2 === 0 ? -1 : 1) * Math.ceil((n - 1) / 2) * 8;
      s += `<circle class="pt" cx="${x(r.temp_C)}" cy="${cy + dy}" r="5.5"/>`;
      s += `<circle class="hit" data-id="${r.id}" cx="${x(r.temp_C)}" cy="${cy + dy}" r="11" tabindex="0" aria-label="${esc(r.id)} ${esc(r.material)} ${r.temp_C} °C"/>`;
    });
  });
  s += "</svg>";
  $("chart").innerHTML = s;
}

function renderTable(rows) {
  $("count").textContent = `${rows.length} / ${RECORDS.length}건`;
  $("empty").hidden = rows.length > 0;
  $("rows").innerHTML = sortRows(rows).map((r) => `
    <tr tabindex="0" data-id="${r.id}">
      <td class="mono">${r.id}<br><span class="chip ${r.field === "FE" ? "fe" : ""}">${FIELD_LABEL[r.field]}</span></td>
      <td><b>${chem(r.material)}</b>${(r.tags || []).length ? `<br><span class="sub">${esc(r.tags.join(" · "))}</span>` : ""}</td>
      <td class="mono" style="font-size:12.5px">${esc(r.precursors.join(", ") || "—")}<br><span class="sub">${esc(r.coreactants.join(", ") || "—")}</span></td>
      <td style="white-space:nowrap">${MODE_LABEL[r.ald_mode] || r.ald_mode}</td>
      <td class="num mono">${fmt(r.temp_C)}${r.temp_C === null && r.temp_note ? '<br><span class="sub">비고</span>' : ""}</td>
      <td class="num mono">${fmt(r.thickness_nm)}</td>
      <td class="num mono">${fmt(r.gpc_A)}</td>
      <td>${esc(POS_LABEL[r.position])}</td>
      <td>${perfText(r)}</td>
      <td class="doi"><a class="mono" href="https://doi.org/${esc(r.source.doi)}" target="_blank" rel="noopener">${esc(r.source.doi)}</a></td>
    </tr>`).join("");
  document.querySelectorAll("th[data-sort]").forEach((th) => {
    const on = th.dataset.sort === state.sort.key;
    th.querySelector(".arr").textContent = on ? (state.sort.dir > 0 ? "↑" : "↓") : "";
    th.setAttribute("aria-sort", on ? (state.sort.dir > 0 ? "ascending" : "descending") : "none");
  });
}

function render() {
  const rows = filtered();
  renderPeriodic(rows);
  renderChart(rows);
  renderTable(rows);
}

function kv(pairs) {
  return `<dl class="kv">${pairs.filter(([, v]) => v !== undefined).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
}

function openDrawer(id) {
  const r = RECORDS.find((x) => x.id === id);
  if (!r) return;
  const src = r.source;
  const perf = r.field === "PSC" ? kv([
    ["소자 구조", fmt(r.psc && r.psc.architecture)],
    ["PCE (ALD)", r.psc && typeof r.psc.pce_pct === "number" ? `<span class="mono">${r.psc.pce_pct}%</span>` : "—"],
    ["PCE (대조군)", r.psc && typeof r.psc.pce_ref_pct === "number" ? `<span class="mono">${r.psc.pce_ref_pct}%</span>` : "—"],
    ["안정성", fmt(r.psc && r.psc.stability)],
  ]) : kv([
    ["조성", fmt(r.fe.composition)], ["전극", fmt(r.fe.electrodes)], ["결정화 열처리", fmt(r.fe.anneal)],
    ["2Pr", typeof r.fe.pr2_uCcm2 === "number" ? `<span class="mono">${r.fe.pr2_uCcm2} μC/cm²</span>` : "—"],
    ["분극 비고", fmt(r.fe.pr_note)],
    ["Ec", typeof r.fe.ec_MVcm === "number" ? `<span class="mono">${r.fe.ec_MVcm} MV/cm</span>` : "—"],
    ["내구성", fmt(r.fe.endurance)],
  ]);
  $("drawer").innerHTML = `
    <div class="drawer-top">
      <div style="display:grid;gap:6px">
        <span class="mono sub">${r.id} · <span class="chip ${r.field === "FE" ? "fe" : ""}">${FIELD_LABEL[r.field]}</span></span>
        <h3 id="d-title">${chem(r.material)} · ${esc(POS_LABEL[r.position])}</h3>
      </div>
      <button class="btn" type="button" id="close">닫기</button>
    </div>
    <p class="finding">${esc(r.key_finding)}</p>
    <section><h4>ALD 공정 조건</h4>${kv([
      ["전구체", `<span class="mono">${esc(r.precursors.join(", ") || "—")}</span>`],
      ["반응물", `<span class="mono">${esc(r.coreactants.join(", ") || "—")}</span>`],
      ["방식", MODE_LABEL[r.ald_mode] || r.ald_mode],
      ["증착 온도", typeof r.temp_C === "number" ? `<span class="mono">${r.temp_C} °C</span>` : "—"],
      ["온도 비고", fmt(r.temp_note)],
      ["사이클", typeof r.cycles === "number" ? `<span class="mono">${r.cycles}</span>` : "—"],
      ["사이클·펄스 비고", fmt(r.cycle_note)],
      ["두께", typeof r.thickness_nm === "number" ? `<span class="mono">${r.thickness_nm} nm</span>` : "—"],
      ["GPC", typeof r.gpc_A === "number" ? `<span class="mono">${r.gpc_A} Å/cycle</span>` : "—"],
      ["적용 계면", fmt(r.position_note)],
      ["소자 적층", `<span class="mono" style="font-size:12.5px">${esc(r.device_stack || "—")}</span>`],
    ])}</section>
    <section><h4>${r.field === "PSC" ? "소자 성능" : "강유전 특성"}</h4>${perf}</section>
    <section><h4>출처</h4>${kv([
      ["DOI", `<a class="mono" href="https://doi.org/${esc(src.doi)}" target="_blank" rel="noopener">${esc(src.doi)}</a>`],
    ])}</section>`;
  $("drawer").classList.add("open");
  $("drawer").setAttribute("aria-hidden", "false");
  $("scrim").classList.add("open");
  $("close").addEventListener("click", closeDrawer);
  $("close").focus();
}
function closeDrawer() {
  $("drawer").classList.remove("open");
  $("drawer").setAttribute("aria-hidden", "true");
  $("scrim").classList.remove("open");
}

function toCSV(rows) {
  const cols = ["id", "field", "material", "precursors", "coreactants", "ald_mode", "temp_C", "cycles", "thickness_nm", "gpc_A",
    "position", "position_note", "device_stack", "pce_pct", "pce_ref_pct", "stability", "pr2_uCcm2", "ec_MVcm", "anneal", "endurance",
    "doi"];
  const q = (v) => { const s = v === null || v === undefined ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const line = (r) => [r.id, r.field, r.material, r.precursors.join("; "), r.coreactants.join("; "), r.ald_mode, r.temp_C, r.cycles,
    r.thickness_nm, r.gpc_A, r.position, r.position_note, r.device_stack, r.psc && r.psc.pce_pct, r.psc && r.psc.pce_ref_pct, r.psc && r.psc.stability,
    r.fe && r.fe.pr2_uCcm2, r.fe && r.fe.ec_MVcm, r.fe && r.fe.anneal, r.fe && r.fe.endurance,
    r.source.doi].map(q).join(",");
  return [cols.join(","), ...rows.map(line)].join("\n");
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); toast(`${what} ${filtered().length}건을 클립보드에 복사했다`); }
  catch (e) { toast("복사가 막혀 있다. 브라우저에서 클립보드 권한을 허용한 뒤 다시 누른다"); }
}

function init() {
  renderStats();
  const uniq = (f) => [...new Set(RECORDS.flatMap(f))].sort((a, b) => a.localeCompare(b));
  fillSelect("pos", POS_ORDER.filter((p) => RECORDS.some((r) => r.position === p)), (p) => POS_LABEL[p], "전체");
  fillSelect("prec", uniq((r) => r.precursors), null, "전체");
  fillSelect("co", uniq((r) => r.coreactants), null, "전체");
  fillSelect("mode", Object.keys(MODE_LABEL).filter((m) => RECORDS.some((r) => r.ald_mode === m)), (m) => MODE_LABEL[m], "전체");

  $("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  $("field-seg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.field = b.dataset.v;
    $("field-seg").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    render();
  });
  ["pos", "prec", "co", "mode"].forEach((id) => $(id).addEventListener("change", (e) => { state[id] = e.target.value; render(); }));
  ["tmin", "tmax"].forEach((id) => $(id).addEventListener("input", (e) => { const v = e.target.value; state[id] = v === "" ? null : Number(v); render(); }));
  $("ptable").addEventListener("click", (e) => {
    const b = e.target.closest("button.el"); if (!b) return;
    const s = b.dataset.el; state.els.has(s) ? state.els.delete(s) : state.els.add(s); render();
  });
  $("reset").addEventListener("click", () => {
    Object.assign(state, { q: "", field: "all", pos: "", prec: "", co: "", mode: "", tmin: null, tmax: null });
    state.els.clear();
    ["q", "pos", "prec", "co", "mode", "tmin", "tmax"].forEach((id) => { $(id).value = ""; });
    $("field-seg").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === "all")));
    render();
  });
  document.querySelectorAll("th[data-sort]").forEach((th) => th.addEventListener("click", () => {
    const k = th.dataset.sort;
    state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : 1 };
    renderTable(filtered());
  }));
  $("rows").addEventListener("click", (e) => { const tr = e.target.closest("tr"); if (tr) openDrawer(tr.dataset.id); });
  $("rows").addEventListener("keydown", (e) => { if (e.key === "Enter") { const tr = e.target.closest("tr"); if (tr) openDrawer(tr.dataset.id); } });
  $("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
  $("copy-csv").addEventListener("click", () => copy(toCSV(sortRows(filtered())), "CSV"));
  $("copy-json").addEventListener("click", () => copy(JSON.stringify(sortRows(filtered()), null, 2), "JSON"));

  const tip = $("tip"), chart = $("chart");
  const showTip = (target) => {
    const r = RECORDS.find((x) => x.id === target.dataset.id); if (!r) return;
    tip.innerHTML = `<b>${esc(r.id)}</b> ${chem(r.material)}<br>${r.temp_C} °C · ${esc(r.precursors.join(", ") || "전구체 미확인")}<br><span class="mono">${esc(r.source.doi)}</span>`;
    const box = chart.getBoundingClientRect(), c = target.getBoundingClientRect();
    tip.style.left = `${c.left - box.left + chart.offsetLeft + 14}px`;
    tip.style.top = `${c.top - box.top + chart.offsetTop - 8}px`;
    tip.style.opacity = 1;
  };
  chart.addEventListener("mouseover", (e) => { if (e.target.classList.contains("hit")) showTip(e.target); });
  chart.addEventListener("focusin", (e) => { if (e.target.classList.contains("hit")) showTip(e.target); });
  chart.addEventListener("mouseout", () => { tip.style.opacity = 0; });
  chart.addEventListener("focusout", () => { tip.style.opacity = 0; });
  chart.addEventListener("click", (e) => { if (e.target.classList.contains("hit")) openDrawer(e.target.dataset.id); });
  chart.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.classList.contains("hit")) openDrawer(e.target.dataset.id); });
  chart.parentElement.style.position = "relative";
  chart.parentElement.appendChild(tip);
  render();
}
init();
</script>
</body>
</html>
